name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Smoke subset only: full `unittest discover -s tests` hangs in CI (API/sim).
      # test_physics currently fails (API drift); excluded until fixed.
      # Follow-up: investigate/fix discover hangs; restore full suite when green.
      - name: Run unit tests
        timeout-minutes: 10
        run: python -m unittest tests.test_queuing -v
